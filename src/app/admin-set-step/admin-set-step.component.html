<!-- Admin → Set step template (paired with admin-set-step.component.ts). -->
<h2 class="section-title">Set step</h2>
<p class="section-sub">
  Force a job's workflow to a specific stage. Stages before it are marked signed/accepted;
  the chosen stage and everything after it are re-opened. This is an admin override.
</p>

<section class="panel">
  <div class="detail-grid mb-sm">
    <div>
      <div class="meta">Job</div>
      <select class="select select-sm select-bordered w-full"
              [ngModel]="selectedJobId()" (ngModelChange)="pickJob($event)">
        <option [ngValue]="null">Select a job</option>
        @for (o of jobOptions; track o.value) {
          <option [ngValue]="o.value">{{ o.label }}</option>
        }
      </select>
    </div>

    @if (selectedJob()) {
      <div>
        <div class="meta">Current step</div>
        <div><span class="badge badge-info badge-sm">{{ currentStep() }}</span></div>
      </div>

      <div>
        <div class="meta">Target step</div>
        <select class="select select-sm select-bordered w-full"
                [ngModel]="targetIndex()" (ngModelChange)="targetIndex.set($event)">
          <option [ngValue]="null">Select a step</option>
          @for (o of stepOptions(); track o.value) {
            <option [ngValue]="o.value">{{ o.label }}</option>
          }
        </select>
      </div>
    }
  </div>

  <button type="button" class="btn btn-sm btn-primary" [disabled]="!selectedJob() || targetIndex() === null" (click)="apply()">
    <svg lucideStepForward class="size-4"></svg> Force step
  </button>
</section>
