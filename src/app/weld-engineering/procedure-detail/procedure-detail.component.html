<div class="table-page-wrap">
  <div class="flex items-center gap-2 mb-1">
    <a routerLink="/weld-engineering" class="btn btn-ghost btn-sm">
      <svg lucideArrowLeft class="size-4"></svg> Procedure Lookup
    </a>
    @if (procedure(); as p) {
      <h2 class="section-title m-0">{{ p.id }} — WTN {{ p.wtn }}</h2>
      <span class="spacer"></span>
      <button type="button" class="btn btn-sm btn-primary" (click)="download()">
        <svg lucideDownload class="size-4"></svg> Download
      </button>
    }
  </div>

  @if (pdfUrl(); as url) {
    <iframe [src]="url" style="width: 100%; height: calc(100vh - 8rem); border: 1px solid var(--app-border); border-radius: 0.5rem"></iframe>
  } @else {
    <p style="color: var(--app-text-muted)">Generating document…</p>
  }
</div>
