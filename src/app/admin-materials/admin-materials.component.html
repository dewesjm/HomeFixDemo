<!-- Admin → Materials maintenance table (paired with the component). -->
<h2 class="section-title">Materials</h2>
<p class="section-sub">Maintain the material list used by the "Material used" dropdown on the Build/install stage.</p>

<p-table #dt [value]="rows" dataKey="id" editMode="row" styleClass="p-datatable-sm"
         [globalFilterFields]="['name']" [columns]="exportColumns" exportFilename="materials">
  <ng-template pTemplate="caption">
    <div class="row">
      <span class="fw-bold">Materials</span>
      <span class="spacer"></span>
      <p-iconfield iconPosition="left">
        <p-inputicon class="pi pi-search" />
        <input #gi pInputText type="text" placeholder="Search materials…"
               (input)="dt.filterGlobal(gi.value, 'contains')" />
      </p-iconfield>
      <p-button label="Export" icon="pi pi-file-excel" size="small" severity="secondary"
                (onClick)="dt.exportCSV()" />
      <p-button label="Add material" icon="pi pi-plus" size="small" (onClick)="addRow()" />
    </div>
  </ng-template>

  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="name" class="min-w-14">
        Material <p-sortIcon field="name" />
        <p-columnFilter type="text" field="name" matchMode="contains" display="menu" />
      </th>
      <th class="min-w-11"></th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-row let-editing="editing" let-ri="rowIndex">
    <tr [pEditableRow]="row">
      <td pEditableColumn>
        <p-cellEditor>
          <ng-template pTemplate="input">
            <input pInputText [(ngModel)]="row.name" class="w-full" placeholder="e.g. Red oak" />
          </ng-template>
          <ng-template pTemplate="output">{{ row.name || '—' }}</ng-template>
        </p-cellEditor>
      </td>
      <td>
        <div class="row-tight">
          <button *ngIf="!editing" pButton pInitEditableRow type="button" icon="pi pi-pencil"
                  [text]="true" severity="secondary" size="small" (click)="onRowEditInit(row)"></button>
          <button *ngIf="editing" pButton pSaveEditableRow type="button" icon="pi pi-check"
                  [text]="true" severity="success" size="small" (click)="onRowEditSave(row)"></button>
          <button *ngIf="editing" pButton pCancelEditableRow type="button" icon="pi pi-times"
                  [text]="true" severity="danger" size="small" (click)="onRowEditCancel(row, ri)"></button>
          <button *ngIf="!editing" pButton type="button" icon="pi pi-trash"
                  [text]="true" severity="danger" size="small" (click)="deleteRow(ri)"></button>
        </div>
      </td>
    </tr>
  </ng-template>

  <ng-template pTemplate="emptymessage">
    <tr><td colspan="2" class="empty">No materials defined.</td></tr>
  </ng-template>
</p-table>
