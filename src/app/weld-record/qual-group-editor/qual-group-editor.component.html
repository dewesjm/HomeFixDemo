<div class="flex flex-wrap items-center gap-2" [class]="nested() ? 'border border-base-300 rounded-box px-2 py-1' : ''">
  @if (holds()) {
    <span class="font-semibold">Holds</span>
  } @else {
    <select class="select select-bordered select-sm w-auto" [ngModel]="group().op" (ngModelChange)="setOp($event)"
            aria-label="Require all or any of these">
      <option value="all">All of (AND)</option>
      <option value="any">Any of (OR)</option>
    </select>
  }

  @for (t of group().items; track $index; let i = $index) {
    @if (i > 0 && !holds()) { <span class="font-semibold">{{ group().op === 'all' ? 'AND' : 'OR' }}</span> }
    @if (asGroup(t); as g) {
      <app-qual-group-editor [group]="g" [allQuals]="allQuals()" [nested]="true"
                             (changed)="setItem(i, $event)" (removed)="removeItem(i)" />
    } @else {
      @let q = asQual(t);
      <span class="badge badge-lg gap-2">
        {{ q }}
        <button type="button" (click)="removeItem(i)" [attr.aria-label]="'Remove ' + q"><svg lucideX class="size-3"></svg></button>
      </span>
    }
  }

  <select class="select select-bordered select-sm w-auto" aria-label="Add a qualification"
          (change)="addQual($any($event.target).value); $any($event.target).value = ''">
    <option value="">Add qual…</option>
    @for (q of addable(); track q) { <option [value]="q">{{ q }}</option> }
  </select>
  @if (!holds()) {
    <button type="button" class="btn btn-sm" (click)="addGroup()">Add group</button>
  }
  @if (nested()) {
    <button type="button" class="btn btn-ghost btn-sm" (click)="removed.emit()" aria-label="Remove group">
      <svg lucideX class="size-4"></svg>
    </button>
  }
</div>
