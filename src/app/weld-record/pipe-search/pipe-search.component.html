<!-- Work orders table template (paired with pipe-search.component.ts). -->
<div class="table-page-wrap">
<div class="page-header">
  <h2 class="section-title">Pipe Welding</h2>
  <app-banner-pill [banner]="banner()" />
</div>
<app-banner-pill [banner]="banner()" placement="below" />

<div class="facet-row">
  <button type="button" class="btn btn-sm btn-outline" (click)="clear()">
    <svg lucideListFilter class="size-4"></svg> Clear filters
  </button>

  <select class="select select-sm select-bordered" style="min-width: 12rem"
          [ngModel]="selectedRole()" (ngModelChange)="onRoleChange($event)">
    @for (o of roleOptions; track o.value) {
      <option [ngValue]="o.value">{{ o.label }}</option>
    }
  </select>

  @if (canReleaseSelected()) {
    <button type="button" class="btn btn-sm btn-primary" (click)="releaseSelected()">
      <svg lucideCheck class="size-4"></svg> Release to Welding ({{ selectedIds().size }})
    </button>
  }

  <span class="spacer"></span>

  <button type="button" class="btn btn-sm btn-outline" (click)="exportCsv()">
    <svg lucideFileSpreadsheet class="size-4"></svg> Export
  </button>

  <label class="input input-sm input-bordered flex items-center gap-2 search-input">
    <svg lucideSearch class="size-4 opacity-60"></svg>
    <input type="text" class="grow"   placeholder="Search XREFID, hull, drawing, joint or order…"
           [ngModel]="table.globalFilter()" (ngModelChange)="table.setGlobalFilter($event)" />
    @if (table.globalFilter()) {
      <button type="button" class="btn btn-ghost btn-xs p-0" (click)="table.setGlobalFilter('')">
        <svg lucideX class="size-3.5 opacity-60"></svg>
      </button>
    }
  </label>
</div>

<div class="flex-1 min-h-0 min-w-0">
<table class="table table-sm">
  <thead>
    <tr>
      <th class="w-8">
        <input type="checkbox" class="checkbox checkbox-xs" [checked]="allSelected()" (change)="toggleSelectAll()" />
      </th>
      <th appSortHeader class="min-w-16" [table]="table" field="xrefid" label="XREFID" filter="text"></th>
      <th appSortHeader class="min-w-32" [table]="table" field="hull" label="Hull" filter="text"></th>
      <th appSortHeader class="min-w-24" [table]="table" field="drawing" label="Drawing" filter="text"></th>
      <th appSortHeader class="min-w-20" [table]="table" field="joint" label="Joint" filter="text"></th>
      <th appSortHeader class="min-w-28" [table]="table" field="order" label="Order" filter="text"></th>
      <th appSortHeader class="min-w-24" [table]="table" field="sequenceNumber" label="Sequence" filter="text"></th>
      <th appSortHeader class="min-w-36" [table]="table" field="currentRouting" label="Current routing" filter="select" [options]="typeOptions()"></th>
      <th class="Actions col-freeze-actions">Actions</th>
    </tr>
  </thead>
  <tbody>
    @for (job of table.paged(); track job.id) {
      <tr>
        <td class="w-8">
          <input type="checkbox" class="checkbox checkbox-xs" [checked]="selectedIds().has(job.id)" (change)="toggleSelect(job.id)" />
        </td>
        <td>{{ job.xrefid }}</td>
        <td>{{ job.hull }}</td>
        <td>{{ job.drawing || '-' }}</td>
        <td>{{ job.joint || '-' }}</td>
        <td>{{ job.order || '-' }}</td>
        <td>{{ job.sequenceNumber || '-' }}</td>
        <td>{{ job.currentRouting }}</td>
        <td class="col-freeze-actions">
          <div class="row-tight">
            <button type="button" class="btn btn-ghost btn-xs" title="History" (click)="openHistory(job)">
              <svg lucideHistory class="size-3"></svg><span class="btn-label"> History</span>
            </button>
            <button type="button" class="btn btn-primary btn-xs" title="Details" (click)="openDetails(job)">
              <svg lucideArrowUpRight class="size-3"></svg><span class="btn-label"> Details</span>
            </button>
          </div>
        </td>
      </tr>
    } @empty {
      <tr><td colspan="9" class="empty">No jobs match your filters.</td></tr>
    }
  </tbody>
</table>
</div>

<app-table-pager [state]="table" [pageSizeOptions]="[10, 25, 50, 100]" />
</div>
