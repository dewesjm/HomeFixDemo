<div>
  <div class="page-header">
    <a routerLink="/admin/ship-locations" class="back-link">
      <svg lucideArrowLeft class="size-4"></svg> Ship Locations
    </a>
    <span class="c-muted">/</span>
    <h2 class="section-title">Import Ship Locations</h2>
  </div>
  <p class="text-sm mb-sm">Import ship locations from a spreadsheet and review them before saving.</p>

  <app-import-grid [importer]="this" noun="ship locations" doneLink="/admin/ship-locations">
    <ng-template #headerCells>
      <th class="min-w-32">Hull</th>
      <th class="min-w-24">Level/Deck</th>
      <th class="min-w-24">Frame</th>
      <th class="min-w-24">P/S/CL</th>
      <th class="min-w-32">Usage</th>
    </ng-template>
    <ng-template #rowCells let-row>
      <td>
        <select class="select select-xs w-full" [(ngModel)]="row.hull" (ngModelChange)="revalidate(row)" [class.select-error]="!row.hull">
          <option value="">-</option>
          @for (h of hulls; track h) { <option [value]="h">{{ h }}</option> }
        </select>
      </td>
      <td><input class="input input-xs w-full" [(ngModel)]="row.deck" (ngModelChange)="revalidate(row)" [class.input-error]="!row.deck" /></td>
      <td><input class="input input-xs w-full" [(ngModel)]="row.frame" (ngModelChange)="revalidate(row)" [class.input-error]="!row.frame" /></td>
      <td>
        <!-- the open list reads "2 Port"; the closed box shows just the number -->
        <div class="relative">
          <select class="select select-xs select-overlay-label w-full" [(ngModel)]="row.pscl" (ngModelChange)="revalidate(row)" [class.select-error]="!row.pscl">
            <option class="text-base-content" value="">-</option>
            @for (p of psclOptions; track p.value) { <option class="text-base-content" [value]="p.value">{{ p.label }}</option> }
          </select>
          <span class="absolute inset-y-0 left-3 right-7 flex items-center pointer-events-none truncate text-xs">{{ row.pscl || '-' }}</span>
        </div>
      </td>
      <!-- S and D hulls have no Usage -->
      <td><input class="input input-xs w-full" [(ngModel)]="row.usage" (ngModelChange)="revalidate(row)" [disabled]="!hasUsage(row.hull)"
                 [class.input-error]="hasUsage(row.hull) && !row.usage" /></td>
    </ng-template>
  </app-import-grid>
</div>
