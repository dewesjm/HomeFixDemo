<!-- Admin → Routing Override template (paired with admin-set-routing.component.ts). -->
<h2 class="section-title">Routing Override</h2>

<section class="panel">
  <div class="detail-grid mb-sm">
    <div>
      <div class="meta">Hull</div>
      <input type="text" class="input input-sm input-bordered w-full"
             [ngModel]="hull()" (ngModelChange)="setKey('hull', $event)">
    </div>
    <div>
      <div class="meta">Drawing</div>
      <input type="text" class="input input-sm input-bordered w-full"
             [ngModel]="drawing()" (ngModelChange)="setKey('drawing', $event)">
    </div>
    <div>
      <div class="meta">Joint</div>
      <input type="text" class="input input-sm input-bordered w-full"
             [ngModel]="joint()" (ngModelChange)="setKey('joint', $event)">
    </div>

    @if (allTyped() && !selectedJob()) {
      <div class="text-error">No joint matches that Hull, Drawing and Joint.</div>
    }

    @if (selectedJob()) {
      <div>
        <div class="meta">Current routing</div>
        <div><span class="badge badge-info badge-sm">{{ currentRouting() }}</span></div>
      </div>

      <div>
        <div class="meta">Target routing</div>
        <select class="select select-sm select-bordered w-full"
                [ngModel]="targetId()" (ngModelChange)="targetId.set($event)">
          <option [ngValue]="null">Select a routing</option>
          @for (o of typeOptions(); track o.value) {
            <option [ngValue]="o.value">{{ o.label }}</option>
          }
        </select>
      </div>

      <div>
        <div class="meta">Reason for change</div>
        <input type="text" class="input input-sm input-bordered w-full"
               [ngModel]="reason()" (ngModelChange)="reason.set($event)">
      </div>
    }
  </div>

  <button type="button" class="btn btn-sm btn-primary" [disabled]="!selectedJob() || targetId() === null || !reason().trim()" (click)="apply()">
    <svg lucideRoute class="size-4"></svg> Set routing
  </button>
</section>
