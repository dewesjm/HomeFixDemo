<!-- Admin → Set routing template (paired with admin-set-routing.component.ts). -->
<h2 class="section-title">Set routing</h2>
<p class="section-sub">
  Set a job's current routing back to an earlier step. Nothing is marked signed:
  that step and every step after it come up blank and are signed again. Earlier signoffs are kept.
</p>

<section class="panel">
  <div class="detail-grid mb-sm">
    <div>
      <div class="meta">Job</div>
      <select class="select select-sm select-bordered w-full"
              [ngModel]="selectedJobId()" (ngModelChange)="pickJob($event)">
        <option [ngValue]="null">Select a job</option>
        @for (o of jobOptions; track o.value) {
          <option [ngValue]="o.value">{{ o.label }}</option>
        }
      </select>
    </div>

    @if (selectedJob()) {
      <div>
        <div class="meta">Current routing</div>
        <div><span class="badge badge-info badge-sm">{{ currentRouting() }}</span></div>
      </div>

      <div>
        <div class="meta">Target routing</div>
        <select class="select select-sm select-bordered w-full"
                [ngModel]="targetId()" (ngModelChange)="targetId.set($event)">
          <option [ngValue]="null">Select a routing</option>
          @for (o of routingOptions(); track o.value) {
            <option [ngValue]="o.value">{{ o.label }}</option>
          }
        </select>
      </div>
    }
  </div>

  <button type="button" class="btn btn-sm btn-primary" [disabled]="!selectedJob() || targetId() === null" (click)="apply()">
    <svg lucideStepBack class="size-4"></svg> Set routing back
  </button>
</section>
