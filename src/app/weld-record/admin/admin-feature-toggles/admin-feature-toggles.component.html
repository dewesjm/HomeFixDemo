<!-- Admin > Feature Toggles: demo-only switches -->
<h2 class="section-title">Feature Toggles</h2>
<p class="section-sub">Turn demo-only features on or off. Changes save right away.</p>

<div class="flex flex-col gap-4 max-w-xl">
  <label class="flex items-start gap-3 cursor-pointer">
    <input type="checkbox" class="toggle toggle-primary mt-0.5"
           [checked]="toggles().routingPreview" (change)="set('routingPreview', $any($event.target).checked)" />
    <span>
      <span class="font-semibold">Routing preview</span>
      <span class="block">Shows where each step will route to on signoff, under its Signoff button.</span>
    </span>
  </label>
</div>
