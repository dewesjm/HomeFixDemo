<!-- Admin > Feature Toggles: demo-only switches -->
<h2 class="section-title">Feature Toggles</h2>

<div class="flex flex-col gap-4 max-w-xl">
  <label class="flex items-start gap-3 cursor-pointer">
    <input type="checkbox" class="toggle toggle-primary mt-0.5"
           [checked]="toggles().routingPreview" (change)="set('routingPreview', $any($event.target).checked)" />
    <span>
      <span class="font-semibold">Routing preview</span>
      <span class="block">Shows where each step will route to on signoff, under its Signoff button.</span>
    </span>
  </label>
  <label class="flex items-start gap-3 cursor-pointer">
    <input type="checkbox" class="toggle toggle-primary mt-0.5"
           [checked]="toggles().classicPipeWelding" (change)="set('classicPipeWelding', $any($event.target).checked)" />
    <span>
      <span class="font-semibold">Classic Pipe Welding page</span>
      <span class="block">Brings back the old Pipe Welding table, without Advanced Search's filters, columns and views, as Pipe Welding (Classic) in the Weld Record menu.</span>
    </span>
  </label>
  <label class="flex items-start gap-3 cursor-pointer">
    <input type="checkbox" class="toggle toggle-primary mt-0.5"
           [checked]="toggles().definitionLayout" (change)="set('definitionLayout', $any($event.target).checked)" />
    <span>
      <span class="font-semibold">Layout from Signoff Type Definition</span>
      <span class="block">Each step's sign-off form is drawn from its Signoff Type Definition: the order of its fields, which fields share a line, and its headings, all set on Admin → Signoff Type Definition. Off: the built-in layouts.</span>
    </span>
  </label>
</div>
