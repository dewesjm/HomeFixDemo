<div class="table-page-wrap">
  <h2 class="section-title">Material Classification</h2>

  <app-table-toolbar [table]="table" searchPlaceholder="Search material codes…" (exportCsv)="exportCsv()">
    <div toolbarEnd class="flex gap-2">
      <input class="input input-bordered input-sm" placeholder="New material code…"
             [ngModel]="newCode()" (ngModelChange)="newCode.set($event)"
             (keyup.enter)="addEntry()" />
      <button type="button" class="btn btn-sm btn-primary" (click)="addEntry()">
        <svg lucidePlus class="size-4"></svg> Add
      </button>
    </div>
  </app-table-toolbar>

  <div class="overflow-x-auto">
    <table class="table table-sm">
      <thead>
        <tr>
          <th appSortHeader [table]="table" field="code" label="Material Code"></th>
          <th appSortHeader [table]="table" field="nonFerrousOrAustenitic" label="Non-Ferrous or Austenitic"></th>
          <th appSortHeader [table]="table" field="titanium" label="Titanium"></th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        @for (entry of table.sorted(); track entry.code) {
          <tr>
            <td class="font-medium">{{ entry.code }}</td>
            <td>
              <input type="checkbox" class="toggle toggle-sm toggle-success"
                     [checked]="entry.nonFerrousOrAustenitic"
                     (change)="toggleFlag(entry, 'nonFerrousOrAustenitic')" />
            </td>
            <td>
              <input type="checkbox" class="toggle toggle-sm toggle-success"
                     [checked]="entry.titanium"
                     (change)="toggleFlag(entry, 'titanium')" />
            </td>
            <td>
              <button type="button" class="btn btn-ghost btn-xs text-error" (click)="removeEntry(entry)">
                <svg lucideTrash2 class="size-3"></svg>
              </button>
            </td>
          </tr>
        } @empty {
          <tr><td colspan="4" class="empty">{{ table.hasRows() ? 'No material codes match your search.' : 'No material codes yet.' }}</td></tr>
        }
      </tbody>
    </table>

    <div class="flex justify-end mt-3">
      <button type="button" class="btn btn-sm btn-primary" (click)="save()">Save</button>
    </div>
  </div>
</div>
