<h2 class="section-title">Locations</h2>
<p class="section-sub">Manage shop and field locations used in the Fabrication section.</p>

<div class="facet-row mb-sm">
  <span class="fw-bold">Locations</span>
  <span class="spacer"></span>
  <button type="button" class="btn btn-sm btn-primary" (click)="addRow()">
    <svg lucidePlus class="size-4"></svg> Add location
  </button>
</div>

<div class="overflow-x-auto">
<table class="table table-sm">
  <thead>
    <tr>
      <th class="min-w-44">Name</th>
      <th class="min-w-11"></th>
    </tr>
  </thead>
  <tbody>
    @for (row of rows(); track row.uid) {
      <tr>
        <td>
          @if (editingId() === row.uid) {
            <input type="text" class="input input-sm input-bordered w-full min-w-0"
                   [ngModel]="row.name" (ngModelChange)="updateField(row, $event)"
                   placeholder="e.g. Bay 3" autofocus />
          } @else {
            {{ row.name || '—' }}
          }
        </td>
        <td>
          <div class="row-tight">
            @if (editingId() === row.uid) {
              <button type="button" class="btn btn-ghost btn-xs" (click)="saveEdit(row)">
                <svg lucideCheck class="size-4"></svg>
              </button>
              <button type="button" class="btn btn-ghost btn-xs" (click)="cancelEdit(row)">
                <svg lucideX class="size-4"></svg>
              </button>
            } @else {
              <button type="button" class="btn btn-ghost btn-xs" (click)="startEdit(row)">
                <svg lucidePencil class="size-4"></svg>
              </button>
              <button type="button" class="btn btn-ghost btn-xs text-error" (click)="deleteRow(row)">
                <svg lucideTrash2 class="size-4"></svg>
              </button>
            }
          </div>
        </td>
      </tr>
    } @empty {
      <tr><td colspan="2" class="empty">No locations configured.</td></tr>
    }
  </tbody>
</table>
</div>
