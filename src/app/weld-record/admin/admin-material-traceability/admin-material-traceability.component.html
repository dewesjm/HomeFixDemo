<div class="table-page-wrap">
  <div class="flex items-center gap-2 mb-1">
    <button type="button" class="btn btn-ghost btn-sm" routerLink="/table">
      Back
    </button>
    <h2 class="section-title m-0">Material Traceability</h2>
  </div>
  <p class="section-sub">
    Map MCL values to whether material traceability is required.
    When traceability is required, MIC fields become visible on the Fabrication section.
  </p>

  <div class="panel">
    <table class="table table-sm">
      <thead>
        <tr>
          <th>MCL Value</th>
          <th>Requires Traceability</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        @for (entry of entries(); track entry.mclValue) {
          <tr>
            <td class="font-medium">{{ entry.mclValue }}</td>
            <td>
              <input type="checkbox" class="toggle toggle-sm toggle-success"
                     [checked]="entry.requiresTraceability"
                     (change)="toggleTraceability(entry)" />
            </td>
            <td>
              <button type="button" class="btn btn-ghost btn-xs text-error" (click)="removeEntry(entry)">
                <svg lucideTrash2 class="size-3"></svg>
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>

    <div class="flex gap-2 mt-2">
      <input class="input input-bordered input-sm" placeholder="New MCL value..."
             [ngModel]="newMclValue()" (ngModelChange)="newMclValue.set($event)"
             (keyup.enter)="addEntry()" />
      <button type="button" class="btn btn-sm btn-primary" (click)="addEntry()">
        <svg lucidePlus class="size-3"></svg> Add
      </button>
    </div>

    <div class="flex justify-end mt-3">
      <button type="button" class="btn btn-sm btn-primary" (click)="save()">Save</button>
    </div>
  </div>
</div>
