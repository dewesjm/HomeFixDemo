<!-- Work history screen template (paired with work-history.component.ts). -->
<div class="table-page-wrap">
<div class="flex items-center gap-2 mb-3">
  <button type="button" class="btn btn-ghost btn-sm" (click)="back()">
    <svg lucideArrowLeft class="size-4"></svg> Back
  </button>
  <h2 class="section-title m-0">History</h2>
</div>

<div class="facet-row">
  <!-- Person: type a first or last name (or id); pick from the matches. Never a full list. -->
  <div style="min-width: 16rem">
    <app-person-search-input mode="picker" size="sm" placeholder="Person: name, PERNR or ID"
      [selected]="person()" (select)="choosePerson($event)" (clear)="clearPerson()" />
  </div>

  <label class="input input-sm input-bordered flex items-center gap-2" style="min-width: 12rem">
    <svg lucideBriefcase class="size-4 opacity-60"></svg>
    <input type="text" class="grow"            placeholder="Search XREFID, drawing, joint or order…"
           [ngModel]="jobQuery()" (ngModelChange)="jobQuery.set($event)" />
  </label>

  <label class="input input-sm input-bordered flex items-center gap-2 grow">
    <svg lucideSearch class="size-4 opacity-60"></svg>
    <input type="text" class="grow"            placeholder="Search history…"
           [ngModel]="table.globalFilter()" (ngModelChange)="table.setGlobalFilter($event)" />
  </label>
  <button type="button" class="btn btn-sm btn-outline" [disabled]="!table.expandableKeys().length" (click)="table.toggleAll()">
    @if (table.allExpanded()) { <svg lucideChevronsDownUp class="size-4"></svg> Collapse all } @else { <svg lucideChevronsUpDown class="size-4"></svg> Expand all }
  </button>

  <span class="spacer"></span>
  <button type="button" class="btn btn-sm btn-outline" [disabled]="!table.sorted().length" (click)="exportCsv()">
    <svg lucideFileSpreadsheet class="size-4"></svg> Export to Excel
  </button>
  <button type="button" class="btn btn-sm btn-outline" (click)="clear()">
    <svg lucideListFilter class="size-4"></svg> Clear
  </button>
</div>

<!-- Activity log -->
<div class="row">
  <svg lucideHistory class="size-4"></svg>
  <span class="fw-bold">Activity {{ scopeLabel() }}</span>
  <span class="meta fw-normal">· {{ table.total() }} entries</span>
</div>

<app-history-table [table]="table" (deprogress)="deprogress($event.jobId, $event.reason)" />

<app-table-pager [state]="table" [pageSizeOptions]="[15, 30, 50, 100]" />
</div>
