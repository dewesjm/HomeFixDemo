<section class="panel">
  <h3 class="panel-title"><svg lucideWorkflow class="size-4"></svg> Routing</h3>
  <div class="routing-scroll" #scrollContainer>
    @for (s of steps(); track $index) {
      <div class="routing-step" [class.active]="s.stageIndex === selectedStep()" [class.done]="s.stageIndex < selectedStep()" [class.disabled]="s.disabled">
        <div class="routing-num" [class.active]="s.stageIndex === selectedStep()" [class.done]="s.stageIndex < selectedStep()">{{ $index + 1 }}</div>
        <div class="routing-label">{{ s.label }}</div>
      </div>
    }
  </div>
</section>
