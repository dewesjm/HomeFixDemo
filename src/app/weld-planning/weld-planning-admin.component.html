<div>
  <div class="page-header">
    <a routerLink="/weld-planning" class="back-link">
      <svg lucideArrowLeft class="size-4"></svg> Weld Planning
    </a>
    <span style="color: var(--app-text-muted)">/</span>
    <h2 class="section-title">Admin</h2>
  </div>

    <div class="panel">
      <div class="panel-title">Joint Design Options</div>
      <p class="section-sub">Manage available joint design codes. Inactive designs are hidden from form dropdowns.</p>
      <div style="display: flex; gap: 0.5rem; margin-bottom: 1rem">
        <input class="input input-sm" [(ngModel)]="newDesignCode" placeholder="Code" style="width: 8rem" />
        <input class="input input-sm" [(ngModel)]="newDesignLabel" placeholder="Label" style="width: 10rem" />
        <button class="btn btn-sm btn-primary" (click)="addDesign()">
          <svg lucidePlus class="size-4"></svg> Add
        </button>
      </div>
      <table class="table table-sm">
        <thead><tr><th>Code</th><th>Label</th><th>Active</th><th></th></tr></thead>
        <tbody>
          @for (d of designs(); track d.code) {
            <tr>
              <td class="mono">{{ d.code }}</td>
              <td>{{ d.label }}</td>
              <td><input type="checkbox" class="checkbox checkbox-sm" [checked]="d.active" (change)="toggleDesignActive(d.code)" /></td>
              <td><button class="btn btn-xs btn-ghost text-error" (click)="removeDesign(d.code)"><svg lucideTrash2 class="size-3"></svg></button></td>
            </tr>
          }
        </tbody>
      </table>
      <div style="display: flex; justify-content: flex-end; margin-top: 1rem">
        <button class="btn btn-sm btn-primary" (click)="saveDesigns()"><svg lucideSave class="size-4"></svg> Save</button>
      </div>
    </div>
</div>
