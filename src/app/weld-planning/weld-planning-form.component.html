<div>
  <div class="page-header">
    <a routerLink="/weld-planning" class="back-link">
      <svg lucideArrowLeft class="size-4"></svg> Weld Planning
    </a>
    <span style="color: var(--app-text-muted)">/</span>
    <h2 class="section-title">{{ isEdit() ? 'Edit Joint' : 'Create Joint' }}</h2>
  </div>

  <div class="panel">
    <div class="panel-title">Basic Information</div>
    <div class="detail-grid">
      <div class="detail-col">
        <label class="field-label">Joint Type <span class="required-mark">*</span></label>
        <select class="select select-sm" [(ngModel)]="form.jointType">
          @for (opt of jointTypeOptions; track opt.value) {
            <option [value]="opt.value">{{ opt.label }}</option>
          }
        </select>
      </div>
      <div class="detail-col">
        <label class="field-label">Joint Number <span class="required-mark">*</span></label>
        <input class="input input-sm" [(ngModel)]="form.jointNumber" placeholder="ST-00001" />
      </div>
      <div class="detail-col">
        <label class="field-label">Hull</label>
        <select class="select select-sm" [(ngModel)]="form.hull">
          <option value="">Select...</option>
          @for (p of hulls; track p) {
            <option [value]="p">{{ p }}</option>
          }
        </select>
      </div>
      <div class="detail-col">
        <label class="field-label">Joint</label>
        <input class="input input-sm" [(ngModel)]="form.joint" placeholder="ST-10005" />
      </div>
      <div class="detail-col">
        <label class="field-label">Drawing</label>
        <input class="input input-sm" [(ngModel)]="form.drawing" placeholder="H7111234" />
      </div>
      <div class="detail-col">
        <label class="field-label">Drawing Rev</label>
        <input class="input input-sm" [(ngModel)]="form.drawingRev" placeholder="A" />
      </div>
      <div class="detail-col">
        <label class="field-label">Status <span class="required-mark">*</span></label>
        <select class="select select-sm" [(ngModel)]="form.status">
          @for (opt of statusOptions; track opt.value) {
            <option [value]="opt.value">{{ opt.label }}</option>
          }
        </select>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">Welding Attributes</div>
    <div class="detail-grid">
      <div class="detail-col">
        <label class="field-label">Joint Design <span class="required-mark">*</span></label>
        <select class="select select-sm" [(ngModel)]="form.jointDesign">
          <option value="">Select...</option>
          @for (d of designOptions(); track d.code) {
            <option [value]="d.label">{{ d.label }}</option>
          }
        </select>
      </div>
      <div class="detail-col">
        <label class="field-label">Weld Type <span class="required-mark">*</span></label>
        <select class="select select-sm" [(ngModel)]="form.weldType">
          <option value="">Select...</option>
          @for (t of weldTypes; track t) {
            <option [value]="t">{{ t }}</option>
          }
        </select>
      </div>
      @if (form.jointType === 'pipe') {
        <div class="detail-col">
          <label class="field-label">Pipe Size</label>
          <select class="select select-sm" [(ngModel)]="form.pipeSize">
            <option value="">Select...</option>
            @for (s of pipeSizes; track s) {
              <option [value]="s">{{ s }}</option>
            }
          </select>
        </div>
        <div class="detail-col">
          <label class="field-label">Wall Thickness</label>
          <select class="select select-sm" [(ngModel)]="form.wallThickness">
            <option value="">Select...</option>
            @for (t of wallThicknesses; track t) {
              <option [value]="t">{{ t }}</option>
            }
          </select>
        </div>
      }
      <div class="detail-col">
        <label class="field-label">Material 1</label>
        <select class="select select-sm" [(ngModel)]="form.materialType1">
          <option value="">Select...</option>
          @for (m of materials1; track m) {
            <option [value]="m">{{ m }}</option>
          }
        </select>
      </div>
      <div class="detail-col">
        <label class="field-label">Material 2</label>
        <select class="select select-sm" [(ngModel)]="form.materialType2">
          <option value="">Select...</option>
          @for (m of materials2; track m) {
            <option [value]="m">{{ m }}</option>
          }
        </select>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">NDT Requirements</div>
    <div class="detail-grid">
      @for (n of ndtFields; track n.key) {
        <div class="detail-col">
          <label class="field-label">{{ n.label }}</label>
          <select class="select select-sm" [(ngModel)]="form[n.key]">
            @for (m of ndtMarks; track m) {
              <option [value]="m">{{ m || 'None' }}</option>
            }
          </select>
        </div>
      }
    </div>
  </div>

  <div style="display: flex; gap: 0.75rem; justify-content: flex-end; padding: 1rem 0">
    <button class="btn btn-ghost" (click)="cancel()">
      <svg lucideX class="size-4"></svg> Cancel
    </button>
    <button class="btn btn-primary" (click)="save()">
      <svg lucideSave class="size-4"></svg> {{ isEdit() ? 'Update' : 'Create' }}
    </button>
  </div>
</div>
