<!-- App shell: sidebar (menu, sync status, theme) on the left; routed page on the right. -->
<p-toast />
<div class="layout" [class.collapsed]="collapsed()">
  <aside class="sidebar">
    <h1>HomeFix</h1>
    <p-panelMenu [model]="menu" styleClass="w-full" />
    <app-theme-picker />
  </aside>

  <main class="content">
    <app-sync-status class="content-sync" />
    <p-button class="menu-toggle" icon="pi pi-bars" severity="secondary" [text]="true"
              ariaLabel="Toggle menu" (onClick)="toggle()" />
    <div class="content-body">
      <router-outlet />
    </div>
  </main>
</div>

@if (updateReady()) {
  <p-message severity="info" icon="pi pi-arrow-circle-up" styleClass="update-banner">
    <span>A new version is available.</span>
    <p-button label="Reload" icon="pi pi-refresh" size="small" (onClick)="reloadForUpdate()" />
  </p-message>
}
