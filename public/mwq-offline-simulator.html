<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MWQ offline handoff simulator</title>
<style>
  body { font: 1rem system-ui, sans-serif; color: #172033; background: #f4f6fa; margin: 0; }
  main { box-sizing: border-box; max-width: 48rem; margin: 3rem auto; padding: 1.5rem; background: white; }
  form { display: flex; flex-wrap: wrap; gap: 1rem; align-items: end; }
  label { display: grid; gap: .25rem; flex: 1 1 9rem; min-width: 0; }
  label:first-child { flex-basis: 100%; }
  input, button { font: inherit; padding: .5rem; }
  button { color: white; background: #234998; border: 1px solid #234998; cursor: pointer; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; }
</style>
<main>
  <h1>MWQ offline handoff simulator</h1>
  <form id="prepare">
    <label>Weld Record URL <input name="ewr" type="url" required></label>
    <label>Hull <input name="hull" value="D1034" required></label>
    <label>Drawing <input name="drawing" value="S731-5003" required></label>
    <label>Joint <input name="joint" value="FO-10939" required></label>
    <button>Get ready for offline</button>
  </form>
  <p id="status" role="status"></p>
  <ul id="joints" hidden></ul>
  <details id="response" hidden>
    <summary>Response details</summary>
    <pre id="reply"></pre>
  </details>
</main>
<script type="module">
  const form = document.querySelector('#prepare');
  form.elements.ewr.value = location.origin === 'http://localhost:4322'
    ? 'http://localhost:4321' : location.origin;
  const status = document.querySelector('#status');
  const reply = document.querySelector('#reply');
  const response = document.querySelector('#response');
  const joints = document.querySelector('#joints');
  let handoff;

  form.addEventListener('submit', event => {
    event.preventDefault();
    clearTimeout(handoff?.timeout);
    handoff = undefined;
    reply.textContent = '';
    response.hidden = true;
    joints.replaceChildren();
    joints.hidden = true;
    const ewrUrl = new URL(form.elements.ewr.value);
    const ewrOrigin = ewrUrl.origin;
    if (ewrUrl.protocol !== 'https:' && ewrOrigin !== 'http://localhost:4321') {
      status.textContent = 'Enter an HTTPS Weld Record URL or http://localhost:4321.';
      return;
    }
    const setup = window.open(new URL('/offline/prepare', ewrOrigin), '_blank');
    if (!setup) {
      handoff = undefined;
      status.textContent = 'Allow the Weld Record window to open, then retry.';
      return;
    }

    handoff = {
      setup,
      ewrOrigin,
      request: {
        type: 'ewr-offline-prepare',
        requestId: crypto.randomUUID(),
        joints: [{
          hull: form.elements.hull.value.trim(),
          drawing: form.elements.drawing.value.trim(),
          joint: form.elements.joint.value.trim(),
        }],
      },
      timeout: setTimeout(() => {
        status.textContent = 'Weld Record did not confirm receipt. Check the setup window and retry.';
      }, 15000),
    };
    status.textContent = 'Waiting for Weld Record to confirm receipt.';
  });

  window.addEventListener('message', event => {
    if (!handoff || event.origin !== handoff.ewrOrigin || event.source !== handoff.setup) return;
    if (event.data?.type === 'ewr-offline-listening') {
      handoff.setup.postMessage(handoff.request, handoff.ewrOrigin);
    }
    if (event.data?.requestId !== handoff.request.requestId) return;
    if (event.data.type === 'ewr-offline-request-received') {
      clearTimeout(handoff.timeout);
      status.textContent = 'Preparing Weld Record…';
      handoff.timeout = setTimeout(() => {
        status.textContent = 'Weld Record has not reported readiness. Check the setup tab.';
      }, 55_000);
    }
    if (event.data.type === 'ewr-offline-result') {
      clearTimeout(handoff.timeout);
      status.textContent = event.data.ready
        ? 'Ready for offline'
        : (event.data.error ?? 'Could not prepare all joints for offline use.');
      joints.replaceChildren(...event.data.joints.map(item => {
        const row = document.createElement('li');
        if (item.ready) {
          const link = document.createElement('a');
          link.href = item.url;
          link.textContent = `Open saved Joint Details · ${item.key.hull} / ${item.key.drawing} / ${item.key.joint}`;
          row.append(link);
        } else {
          row.textContent = item.error;
        }
        return row;
      }));
      joints.hidden = !joints.childElementCount;
      reply.textContent = JSON.stringify(event.data, null, 2);
      response.hidden = false;
      handoff.setup.postMessage({
        type: 'ewr-offline-result-received', requestId: handoff.request.requestId,
      }, handoff.ewrOrigin);
    }
  });
</script>
</html>
